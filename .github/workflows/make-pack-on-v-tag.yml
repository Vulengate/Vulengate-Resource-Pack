# This is a basic workflow to help you get started with Actions

name: Build Dev Resource Pack

# Controls when the workflow will run
on:
  push:
    tags:
      - 'v*'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checkout
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Build a ZIP file minecraft can use
      - name: Create ZIP
        run: |
          mkdir pack
          git archive HEAD | tar -x -C pack
          find pack -depth -name '.*' -exec rm -rf {} +
          cd pack
          zip -r ../Vulengate-Resource-Pack.zip .

      # Add the minecraft usable zip too the release
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          files: Vulengate-Resource-Pack.zip
          fail_on_unmatched_files: true
